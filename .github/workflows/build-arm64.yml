name: Build WeChat DevTools (ARM64)

on:
  # 每天 UTC 03:00（北京时间 11:00）自动检查是否有新的稳定版。
  # 版本与仓库根目录 stable_version.txt 记录一致时直接跳过，不触发构建。
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: 'wx-compiler ref (branch/tag/sha)'
        required: false
        default: 'master'
      devtools_ref:
        description: 'wechat-web-devtools-linux ref (has arm64 config)'
        required: false
        default: 'electron'
      skyline:
        description: '构建 Skyline 的 arm64 插件（选择 true 启用，可选特性）'
        required: false
        default: 'true'
      force:
        description: '强制构建（忽略 stable_version.txt 中已记录的版本）'
        required: false
        default: 'false'
      publish_release:
        description: '是否发布 Release 到 wechat-web-devtools-linux-arm64（true/false，默认 true）'
        required: false
        default: 'true'
      release_version:
        description: '自定义 Release 版本号（仅影响 Release 的 tag/名称，其余不变；留空则用 v<开发者工具版本>）'
        required: false
        default: ''

env:
  COMPILER_REF: ${{ github.event.inputs.compiler_ref || 'master' }}
  DEVTOOLS_REF: ${{ github.event.inputs.devtools_ref || 'electron' }}
  SKYLINE: ${{ github.event.inputs.skyline || 'true' }}
  FORCE: ${{ github.event.inputs.force || 'false' }}
  BUILD_TYPE: Release
  # 稳定版版本历史 / 更新日志接口（对应页面
  # https://developers.weixin.qq.com/miniprogram/dev/devtools/log.html#stable 的动态数据源）
  STABLE_API: https://devtools.wxqcloud.qq.com.cn/WechatWebDev/nightly/versions

# 需要写权限把本次构建的版本号回写到 stable_version.txt。
permissions:
  contents: write

# 说明：
# 阶段0 检查最新稳定版：与仓库根目录 stable_version.txt 记录一致则跳过整个构建；
#       不一致则从接口取真实 win32_x64 安装包链接与更新日志。
# 阶段1 在原生 arm64 runner 上编译 wx-compiler，产出 aarch64 的 wcc/wcsc（及 .node 原生模块）。
# 阶段2 在原生 arm64 runner 上用 wechat-web-devtools-linux 自身脚本组装出 Electron 版
#       微信开发者工具 arm64 包（以稳定版安装包作为资源来源），更新日志随产物一起上传。
# 阶段3 默认将 wechat-devtools-arm64.build 产物以 Pre-release 发布到
#       wechat-web-devtools-linux-arm64 仓库，tag 与微信开发者工具版本号一致（如 v2.02.2608070），
#       发布说明来自数据来源；workflow_dispatch 可用 publish_release=false 关闭发布。
# 阶段4 构建成功且发布成功（或已关闭发布）后把本次版本号写回 stable_version.txt。

jobs:
  # ─────────────────────────────────────────────
  # 阶段0：检查稳定版版本
  # ─────────────────────────────────────────────
  check-stable:
    runs-on: ubuntu-22.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      download_url: ${{ steps.check.outputs.download_url }}
    steps:
      - name: Checkout wx-compiler-arm64 (读取 stable_version.txt)
        uses: actions/checkout@v7
        with:
          repository: little-Data/wx-compiler-arm64
          ref: ${{ env.COMPILER_REF }}
          path: self

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 检查稳定版版本并生成更新日志
        id: check
        run: |
          set -euo pipefail
          curl -fsSL "$STABLE_API/history_stable.json" -o stable_history.json
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('stable_history.json','utf8')).history[0].version")
          LOG_FILE=$(node -p "JSON.parse(require('fs').readFileSync('stable_history.json','utf8')).history[0].log_file")
          RECORDED=$(tr -d '[:space:]' < self/stable_version.txt 2>/dev/null || true)
          echo "最新稳定版版本: $VERSION"
          echo "已记录版本    : ${RECORDED:-<无>}"

          if [ "$VERSION" = "$RECORDED" ] && [ "$FORCE" != "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化，跳过构建。"
            exit 0
          fi

          curl -fsSL "$STABLE_API/$LOG_FILE" -o stable_log.json
          # 必须使用 win32_x64 安装包
          URL=$(node -p "const j=JSON.parse(require('fs').readFileSync('stable_log.json','utf8'));const d=j.downloads.find(x=>x.os==='Windows'&&x.arch==='64');d?d.url:''")
          if [ -z "$URL" ]; then
            echo "::error::未找到 win32_x64 安装包下载链接"
            exit 1
          fi
          echo "安装包: $URL"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "download_url=$URL" >> "$GITHUB_OUTPUT"

          # 生成产物内更新日志（纯文本，去掉 markdown 反引号）与 Release 说明（markdown）
          cat > gen-meta.js <<'EOF'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('stable_log.json', 'utf8'));

          const note = ['版本：' + j.version, '更新日期：' + j.update_time, ''];
          for (const c of (j.categories || [])) {
            note.push(c.title + ' ' + ((c.tag && c.tag.text) || ''));
            for (const it of (c.items || [])) {
              note.push(it.replace(/`/g, '').replace(/^\s*\d+\.\s*/, '').trim());
            }
          }
          fs.writeFileSync('stable_version_note.txt', note.join('\n') + '\n');

          const body = ['## 微信开发者工具 ' + j.version + ' (arm64 Linux)', ''];
          if (j.update_time) body.push('更新日期：' + j.update_time, '');
          if (j.desc) body.push(j.desc.trim(), '');
          for (const c of (j.categories || [])) {
            const tag = (c.tag && c.tag.text) ? ' `' + c.tag.text + '`' : '';
            body.push('### ' + c.title + tag, '');
            for (const it of (c.items || [])) {
              body.push('- ' + it.replace(/^\s*\d+\.\s*/, '').trim());
            }
            body.push('');
          }
          fs.writeFileSync('release_body.md', body.join('\n') + '\n');
          EOF
          node gen-meta.js
          echo "----- stable_version_note.txt -----"
          cat stable_version_note.txt
          echo "----- release_body.md -----"
          cat release_body.md

      - name: Upload 版本元数据
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stable-meta
          path: |
            stable_version_note.txt
            release_body.md
          retention-days: 7

  # ─────────────────────────────────────────────
  # 阶段1：编译 wx-compiler (arm64)
  # ─────────────────────────────────────────────
  build-compiler:
    needs: check-stable
    if: needs.check-stable.outputs.should_build == 'true'
    # 原生 arm64 runner：确保 wcc/wcsc 可执行文件与 .node 插件全部为 aarch64。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout wx-compiler
        uses: actions/checkout@v7
        with:
          repository: little-Data/wx-compiler-arm64
          ref: ${{ env.COMPILER_REF }}
          path: wx-compiler

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake make pkg-config file \
            xz-utils wget ca-certificates

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 与 Electron 36.6.0 内置的 Node（22.16.0）保持一致
          node-version: '22'

      - name: Enable pnpm & install compiler toolchain deps
        working-directory: wx-compiler
        run: |
          corepack enable
          # --no-frozen-lockfile：lockfile 可能未与当前 HEAD 同步
          pnpm install --no-frozen-lockfile
          pnpm exec cmake-js --version

      - name: Build wcc / wcsc / .node natively (aarch64)
        working-directory: wx-compiler
        run: |
          # 原生 aarch64 编译：host 的 gcc/g++ 本身就是 aarch64 工具链，无需交叉。
          cat > native-arm64.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER gcc)
          set(CMAKE_CXX_COMPILER g++)
          EOF
          cmake -S . -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$PWD/native-arm64.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DTARGET_ARCH=arm64
          cmake --build build-arm64 -j$(nproc) --target wcc wcsc wcc_module wcsc_module

      - name: Collect & verify all artifacts are aarch64
        working-directory: wx-compiler
        run: |
          set -e
          mkdir -p compiler-out
          cp build-arm64/wcc              compiler-out/wcc-arm64
          cp build-arm64/wcsc             compiler-out/wcsc-arm64
          cp build-arm64/wcc_module.node  compiler-out/wcc-arm64.node
          cp build-arm64/wcsc_module.node compiler-out/wcsc-arm64.node
          chmod +x compiler-out/wcc-arm64 compiler-out/wcsc-arm64
          ls -lh compiler-out
          # 每个产物都必须为 aarch64（此前只校验可执行文件，漏校验 .node 插件）
          for f in compiler-out/wcc-arm64 compiler-out/wcsc-arm64 \
                   compiler-out/wcc-arm64.node compiler-out/wcsc-arm64.node; do
            echo "== $f =="; file "$f"
            file "$f" | grep -q 'aarch64' || { echo "::error::$f 不是 aarch64"; exit 1; }
          done

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v7
        with:
          name: wx-compiler-arm64.build
          path: wx-compiler/compiler-out
          retention-days: 7

  # ─────────────────────────────────────────────
  # 阶段2：组装 wechat-dev-tools (arm64, stable)
  # ─────────────────────────────────────────────
  build-devtools:
    needs: [check-stable, build-compiler]
    if: needs.check-stable.outputs.should_build == 'true'
    # 原生 arm64 runner：electron / node / 原生插件全部在 arm64 上本地编译，
    # 从根本上消除 x86 交叉编译产生的 x86-64 文件。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      ACTION_MODE: 'true'
      WINE: 'false'
      STABLE_VERSION: ${{ needs.check-stable.outputs.version }}
      STABLE_URL: ${{ needs.check-stable.outputs.download_url }}
      # 对应 build-with-docker.sh 里的环境，保证 node-gyp / asar 写入仓库内 cache
      npm_config_prefix: ${{ github.workspace }}/devtools/cache/npm/node_global
      npm_config_cache: ${{ github.workspace }}/devtools/cache/npm/node_cache
    steps:
      - name: Checkout wechat-web-devtools-linux
        uses: actions/checkout@v7
        with:
          repository: little-Data/wechat-web-devtools-linux-arm64
          ref: ${{ env.DEVTOOLS_REF }}
          path: devtools

      # 必须 >= Node 20.11：nodegit 的 acquireOpenSSL.mjs 使用 import.meta.dirname，
      # Node<20.11 会将其求值为 undefined，导致 path.join(undefined,...) 崩溃。
      # 目标原生模块 ABI 由 node-gyp 的 --target 决定，与宿主 node 版本无关。
      - name: Set up Node.js (build host tooling)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install build deps
        run: |
          sudo apt-get update
          # 原生 arm64 编译原生模块需要的开发库（交叉时由 sysroot 提供，现在直接装宿主库）
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make pkg-config \
            p7zip-full wget curl unzip zip xz-utils file dpkg \
            ninja-build \
            python3 python-is-python3 \
            libssl-dev libssh2-1-dev libkrb5-dev zlib1g-dev \
            libx11-dev libxkbfile-dev libxdamage-dev libpcre3-dev
          # rebuild-node-modules.sh 强制 `hash python2` 检测；node-gyp@11 实际使用 python3。
          # 提供 python2 符号链接即可通过检查。
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python2

      - name: Download compiler artifact
        uses: actions/download-artifact@v8
        with:
          name: wx-compiler-arm64.build
          path: compiler-out

      - name: Download 版本元数据
        uses: actions/download-artifact@v8
        with:
          name: stable-meta
          path: stable-meta

      - name: Inject wx-compiler into devtools build
        working-directory: devtools
        run: |
          set -e
          CACHE_DIR="cache/compiler"
          mkdir -p "$CACHE_DIR"
          cp ../compiler-out/wcc-arm64       "$CACHE_DIR/wcc-arm64"
          cp ../compiler-out/wcsc-arm64      "$CACHE_DIR/wcsc-arm64"
          cp ../compiler-out/wcc-arm64.node  "$CACHE_DIR/wcc-arm64.node"
          cp ../compiler-out/wcsc-arm64.node "$CACHE_DIR/wcsc-arm64.node"
          chmod +x "$CACHE_DIR/wcc-arm64" "$CACHE_DIR/wcsc-arm64"
          ls -lh "$CACHE_DIR"

      # 将 conf/config.json 的 devtools 版本/下载地址指向本次稳定版，
      # update-wechat-devtools.sh 会据此下载真实的 win32_x64 安装包并解出 resources。
      - name: Point devtools config to stable build
        working-directory: devtools
        run: |
          set -e
          node -e "
            const fs = require('fs');
            const p = 'conf/config.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.devtools = { version: process.env.STABLE_VERSION, template: process.env.STABLE_URL };
            fs.writeFileSync(p, JSON.stringify(c, null, 4) + '\n');
            console.log('devtools.version  =', c.devtools.version);
            console.log('devtools.template =', c.devtools.template);
          "

      - name: Build devtools (native arm64, stable)
        working-directory: devtools
        run: |
          export PATH="$PWD/cache/npm/node_global/bin:$PATH"
          # 原生 arm64：所有 node-gyp / electron / 原生模块均在 arm64 上本地编译，
          # nodegit 的 buildFlags.js 会自动取宿主 arm64，无需再强制 npm_config_arch。
          bash tools/setup-wechat-devtools.sh --arch arm64

      # 可选：从源码构建 Skyline 的 arm64 插件（上游只有 linux-x86_64 二进制）。
      # best-effort：失败仅打 ::warning，不阻断打包（Skyline 为可选特性）。
      - name: Build Skyline native addons (arm64, best-effort)
        if: env.SKYLINE == 'true'
        working-directory: devtools
        run: |
          export PATH="$PWD/cache/npm/node_global/bin:$PATH"
          bash tools/cross/build-skyline-arm64.sh || \
            echo "::warning::Skyline arm64 插件构建失败（不影响主构建）"

      # 兜底：若前置步骤失败留下“解包”状态，这里重新打包，保证产物含 app.asar
      # （否则 wcc/wcsc 等 unpacked 文件会缺失）。同时打印资源布局便于排查。
      - name: Ensure app.asar is packed
        working-directory: devtools
        run: |
          if [ -d resources/app ] && [ ! -f resources/app.asar ]; then
            echo "::warning::resources/app 处于解包状态，重新打包"
            bash tools/asar-helper.sh pack
          fi
          echo "== resources/ =="
          ls -la resources/ | grep -E 'app' || true
          echo "== app.asar.unpacked/node_modules (wcc*) =="
          ls -la resources/app.asar.unpacked/node_modules/ 2>/dev/null | grep -i wcc || echo "(无 wcc)"

      # 只做架构报告，绝不阻断打包与后续步骤：set +e 关闭 errexit，结尾无条件成功。
      - name: Report architecture (aarch64, non-blocking)
        working-directory: devtools
        run: |
          set +e
          echo "== 关键二进制架构 =="
          for f in electron/electron electron/node \
                   resources/app.asar.unpacked/node_modules/wcc-exec/wcc \
                   resources/app.asar.unpacked/node_modules/wcc-exec/wcsc \
                   resources/app.asar.unpacked/node_modules/wcc-electron/build/Release/wcc.node \
                   resources/app.asar.unpacked/node_modules/wcc-electron/build/Release/wcsc.node; do
            if [ -f "$f" ]; then
              if file "$f" | grep -q 'aarch64'; then
                echo "OK    aarch64 : $f"
              else
                echo "::warning::$f 不是 aarch64：$(file "$f")"
              fi
            else
              echo "::warning::文件不存在，跳过 $f"
            fi
          done
          echo "== 扫描原生插件(.node)中的 Linux x86-64（报告，不阻断） =="
          while IFS= read -r f; do
            # 仅把 Linux ELF x86-64 标红；Windows PE 残留（资源自带）不算。
            if file -L "$f" 2>/dev/null | grep -qE 'ELF.*x86-64'; then
              echo "::error::发现 x86-64 ELF: $f"
            fi
          done < <(find resources/app.asar.unpacked/node_modules \
                     electron node bin -type f -iname '*.node' 2>/dev/null)
          echo "== 本地运行 arm64 node 校验 =="
          "$PWD/electron/node" -p "process.arch + ' ' + process.version" || \
            echo "::warning::无法本地运行 node（缺依赖），跳过运行态检查"
          echo "== 架构报告结束（不阻断打包） =="
          true

      # 注：Skyline 原生插件（sharedMemory.node / skyline.node）由仓库脚本
      #   tools/cross/build-skyline-arm64.sh 在 arm64 上从源码构建并注入（已能编译出 arm64 产物）。

      - name: Package release tarball
        working-directory: devtools
        run: |
          set -e
          # 版本与 build-tar.sh 的规则保持一致：
          # 有 resources/app/package.json 读取之，否则回退到 conf/config.json 的 devtools.version。
          export PATH="$PWD/cache/npm/node_global/bin:$PATH"
          if [ -f resources/app/package.json ]; then
            DEVTOOLS_VERSION=$(node -p \
              "JSON.parse(require('fs').readFileSync('resources/app/package.json','utf8')).version")
          else
            DEVTOOLS_VERSION=$(node tools/parse-config.js --get-devtools-version)
          fi
          echo "DEVTOOLS_VERSION=$DEVTOOLS_VERSION"
          bash tools/build-tar.sh "v${DEVTOOLS_VERSION}" arm64
          # 更新日志放入构建产物根目录，随 tarball 一起上传
          cp ../stable-meta/stable_version_note.txt tmp/build/stable_version_note.txt
          ls -lh tmp/build

      - name: Upload devtools artifact
        uses: actions/upload-artifact@v7
        with:
          name: wechat-devtools-arm64.build
          path: devtools/tmp/build/*
          retention-days: 30

  # ─────────────────────────────────────────────
  # 阶段3：发布 Pre-release 到 wechat-web-devtools-linux-arm64
  # ─────────────────────────────────────────────
  release:
    needs: [check-stable, build-devtools]
    # 默认发布；workflow_dispatch 可传 publish_release=false 关闭。
    # 用字符串比较：schedule 触发时 github.event.inputs 为空（null），null != 'false' 为 true。
    if: needs.check-stable.outputs.should_build == 'true' && github.event.inputs.publish_release != 'false'
    runs-on: ubuntu-22.04
    steps:
      - name: Download devtools artifact
        uses: actions/download-artifact@v8
        with:
          name: wechat-devtools-arm64.build
          path: dist

      - name: Download 发布说明
        uses: actions/download-artifact@v8
        with:
          name: stable-meta
          path: stable-meta

      - name: Create Pre-release in wechat-web-devtools-linux-arm64
        uses: softprops/action-gh-release@v3
        env:
          # 自定义版本号仅用于 Release 的 tag/名称，不影响构建产物与版本记录
          RELEASE_TAG: ${{ startsWith(github.event.inputs.release_version, 'v') && github.event.inputs.release_version || format('v{0}', github.event.inputs.release_version || needs.check-stable.outputs.version) }}
        with:
          # 跨仓库发布需要具有目标仓库 contents:write 权限的 PAT
          repository: little-Data/wechat-web-devtools-linux-arm64
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: true
          body_path: stable-meta/release_body.md
          files: |
            dist/*
          fail_on_unmatched_files: true

  # ─────────────────────────────────────────────
  # 阶段4：记录本次构建的稳定版版本
  # ─────────────────────────────────────────────
  update-record:
    needs: [check-stable, build-devtools, release]
    # 构建成功且发布成功（或已关闭发布）时才记录版本；发布失败则跳过以便下次重试
    if: |
      always() &&
      needs.check-stable.outputs.should_build == 'true' &&
      needs.build-devtools.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout wx-compiler-arm64
        uses: actions/checkout@v7
        with:
          repository: little-Data/wx-compiler-arm64
          ref: ${{ env.COMPILER_REF }}
          path: self

      - name: 写回 stable_version.txt
        working-directory: self
        run: |
          set -e
          echo "${{ needs.check-stable.outputs.version }}" > stable_version.txt
          cat stable_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stable_version.txt
          if git diff --cached --quiet; then
            echo "版本记录无变化"
          else
            git commit -m "chore(stable): 记录构建版本 ${{ needs.check-stable.outputs.version }}"
            git push
          fi
